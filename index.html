    /* PAGE 1 BUTTON - "Sort me out Lexi" */

    /* PAGE 2 BUTTON - "Send me my free templates Lexi" */

      top: 79%;
      width: 41%;
      height: 9%;

</head>

  <!-- PAGE 1 -->

    <img src="Page 1.png" alt="Lexi Handles It — You know your trade. Lexi's your upgrade.">
